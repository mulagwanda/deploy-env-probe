---
deployment:
  tasks:
    - export DEPLOYPATH=/home/atpsaeventshq/big5test-app/
    - /bin/cp -R * $DEPLOYPATH 2>/dev/null || true
    - echo "=== PHP ===" > $DEPLOYPATH/public/probe.txt
    - php -v >> $DEPLOYPATH/public/probe.txt 2>&1
    - echo "=== COMPOSER ===" >> $DEPLOYPATH/public/probe.txt
    - which composer >> $DEPLOYPATH/public/probe.txt 2>&1
    - composer --version >> $DEPLOYPATH/public/probe.txt 2>&1
    - echo "=== NODE ===" >> $DEPLOYPATH/public/probe.txt
    - which node >> $DEPLOYPATH/public/probe.txt 2>&1
    - node --version >> $DEPLOYPATH/public/probe.txt 2>&1
    - echo "=== NPM ===" >> $DEPLOYPATH/public/probe.txt
    - which npm >> $DEPLOYPATH/public/probe.txt 2>&1
    - npm --version >> $DEPLOYPATH/public/probe.txt 2>&1
    - echo "=== ARTISAN TEST ===" >> $DEPLOYPATH/public/probe.txt
    - which php8.3 >> $DEPLOYPATH/public/probe.txt 2>&1
